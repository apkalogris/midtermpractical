<!DOCTYPE html>
<html>
    <head>
        <title>NEIU Main Campus Map</title>
        
        <h1>A Map Guide to NEIU's Buildings and Student Amenities</h1>
        
         <link rel="stylesheet" href="style.css">
        
         <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
           integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
           crossorigin=""/>

         <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
           integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
           crossorigin=""></script>

<script type="text/javascript" src="data.js"></script>
        
<style type="text/css">
  html, body { margin: 0; padding: 0; height: 100%; }
  #map { min-height: 100%; }
</style>
        
<style>
  /* Optional: adjust the values below to change the appearance of the legend */
  .legend {
      padding: 6px 8px;
      line-height: 18px;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      border-radius: 5px;
  }

  /* Optional: adjust the values below to change the appearance of the legend color boxes */
  .legend i {
      width: 18px;
      height: 18px;
      float: left;
      margin-right: 8px;
      opacity: 0.7;
  }
</style>
        
    </head>

    <body>
        <div id="map"></div>

        <script type="text/javascript">

          var map = L.map('map', {
              center: [41.979, -87.718547],
              zoom: 16
          });

var canvas = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
   attribution: 'Tiles © Esri — Esri, DeLorme, NAVTEQ',
   maxZoom: 16,
   minZoom: 14
}).addTo(map);

var imagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles © Esri — Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
});

var basemaps = {
    "Light Gray Canvas": canvas,
    "World Imagery": imagery
};
            
L.control.layers(basemaps).addTo(map);

            var cafeteriaIcon = L.icon({
    iconUrl: 'cutlery.png', // url that links to the icon image file, saved in the same folder as the current page 
    iconSize:     [20, 20], // size of the icon image in pixels
    iconAnchor:   [2, 2], // the top left corner of the icon will be aligned so that this point is at the marker's geographical location
    popupAnchor:  [0, -10] // point from which the popup should open, relative to the iconAnchor
});

            var classroomIcon = L.icon({
    iconUrl: 'lecture.png', // url that links to the icon image file, saved in the same folder as the current page 
    iconSize:     [20, 20], // size of the icon image in pixels
    iconAnchor:   [2, 2], // the top left corner of the icon will be aligned so that this point is at the marker's geographical location
    popupAnchor:  [0, -10] // point from which the popup should open, relative to the iconAnchor
});

            var sportIcon = L.icon({
    iconUrl: 'basketball.png', // url that links to the icon image file, saved in the same folder as the current page 
    iconSize:     [20, 20], // size of the icon image in pixels
    iconAnchor:   [2, 2], // the top left corner of the icon will be aligned so that this point is at the marker's geographical location
    popupAnchor:  [0, -10] // point from which the popup should open, relative to the iconAnchor
});

            var libraryIcon = L.icon({
    iconUrl: 'book.png', // url that links to the icon image file, saved in the same folder as the current page 
    iconSize:     [20, 20], // size of the icon image in pixels
    iconAnchor:   [2, 2], // the top left corner of the icon will be aligned so that this point is at the marker's geographical location
    popupAnchor:  [0, -10] // point from which the popup should open, relative to the iconAnchor
});

            var nestIcon = L.icon({
    iconUrl: 'bird-house.png', // url that links to the icon image file, saved in the same folder as the current page 
    iconSize:     [20, 20], // size of the icon image in pixels
    iconAnchor:   [2, 2], // the top left corner of the icon will be aligned so that this point is at the marker's geographical location
    popupAnchor:  [0, -10] // point from which the popup should open, relative to the iconAnchor
});
    
var marker1 = L.marker([41.98248, -87.7187], {icon: classroomIcon, alt: 'Classroom Building'}).addTo(map);
var marker2 = L.marker([41.9805, -87.7171], {icon: classroomIcon, alt: 'Bernard Brommel Hall'}).addTo(map);
var marker3 = L.marker([41.9815, -87.71873], {icon: cafeteriaIcon, alt: 'Cafeteria Building'}).addTo(map);
var marker4 = L.marker([41.9805, -87.7193], {icon: libraryIcon, alt: 'Library'}).addTo(map);
var marker5 = L.marker([41.97969, -87.7199], {icon: nestIcon, alt: 'Nest'}).addTo(map);
var marker6 = L.marker([41.97798, -87.71743], {icon: sportIcon, alt: 'PE Complex Building'}).addTo(map);

var pic1 = '<img src="https://neiuindependent.org/wp-content/uploads/2018/09/IMG_0393-900x600.jpg" alt="The Exterior of Lech Walsea Hall" width="250">';
var pic2 = '<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRVVwD0FmhNCfvwdBPdKxoyqvWKTKoBVcXWtD0w1TUNxRR4yn4G7SCyX2s&s=10" alt="The Exterior of Bernard Brommel Hall" width="250">';
var pic3 = '<img src="20251126_160851.jpg" alt="The view of the Cafeteria" width="250">';
var pic4 = '<img src="https://neiuindependent.org/wp-content/uploads/2017/03/Furlough-Writing-Center-900x600.jpg" alt="The Library Interior at the Academic Support Center" width="250">';
var pic5 = '<img src="https://www.neiu.edu/sites/default/files/styles/wide/public/2025-12/SA-the-nest-summer16_2646_0.jpg?itok=sXMDeZri" alt="An image of the Nest Lobby lounge" width="250">';
var pic6 = '<img src="https://www.neiu.edu/sites/default/files/2025-06/NEIU%20Gym_0.jpg" alt="The view of a basketball court on the PE complex" width="250">';

marker1.bindPopup('<p style="color:#f2dc83; font-weight:bold"> Lech Walsea Hall (LWH): Lech Walsea Hall is a classroom building, where most of the courses are within Humanities, Social Sciences, as well as a handful of GenEd courses as well.</p>' + pic1);
marker2.bindPopup('<p style="color:#f55a33; font-weight:bold"> Bernard Brommel Hall (BBH): Bernard Brommel Hall is a building, where most of the courses are within Natural Sciences, Mathematics as well as a handful of GenEd and Geography courses as well.</p>' + pic2);
marker3.bindPopup('<p style="color:#20e84f; font-weight:bold"> Student Union Cafeteria: The Cafeteria is where students and the campus community can dine, socialize, catch up on work, and recharge.</p>' + pic3);
marker4.bindPopup('<p style="color:#2774e8; font-weight:bold"> Library: Students utilize this building for a variety of reasons, including quiet studying, checking out books, going to the Academic Support Center for tutoring, and more.</p>' + pic4);
marker5.bindPopup('<p style="color:#594e3d; font-weight:bold"> The Nest: The Nest is NEIU student dormeratory, where students can choose to live, relax, and also a lobby has a handful of amentities to enjoy. </p>' + pic5);
marker6.bindPopup('<p style="color:#2d3bc2; font-weight:bold"> The PE Complex: This building is home to lots of sports and fitness activities, where students can go to have fun and enjoy.</p>' + pic6);
            
        </script>
   </body>
</html>
